name: Publish to PyPI

# Publishes on version tags (v0.1.0, v0.2.0, ...) via PyPI trusted publishing.
# One-time setup on pypi.org: project "imagecalculator" -> Publishing -> add GitHub
# publisher (owner/repo, workflow "publish.yml", environment "pypi").

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check tag matches package version
        run: |
          pkg=$(python -c "import re;print(re.search(r'\"([^\"]+)\"', open('src/imagecalculator/_version.py').read()).group(1))")
          test "v$pkg" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$pkg"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
